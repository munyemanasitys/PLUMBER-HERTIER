<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Help | Plumber Hertier</title>
    <style>
        :root {
            --bg-slate: #2f4f4f;
            --bg-dark: #0f172a;
            --gold: #facc15;
            --goldenrod: #daa520;
            --teal-glow: #2ead8f;
            --emergency-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-slate));
            color: #ffffff;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 850px;
        }

        /* Top Navigation so visitors can easily go back Home */
        .top-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .nav-btn {
            text-decoration: none;
            background-color: #000000;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.9rem 1.5rem;
            border: 3px solid #1e293b;
            border-radius: 16px;
            box-shadow: 6px 6px 0px var(--goldenrod);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 9px 9px 0px var(--goldenrod);
        }

        .nav-btn.home-btn {
            background-color: var(--gold);
            color: #0f172a;
            box-shadow: 6px 6px 0px #000000;
        }

        /* Main Decision Card keeping your gold shadow & bold rounded frame */
        .decision-card {
            background: rgba(15, 23, 42, 0.92);
            border: 5px solid #000000;
            border-radius: 32px;
            box-shadow: 14px 14px 0px var(--goldenrod);
            padding: 2.5rem 1.5rem;
        }

        h1 {
            font-size: clamp(1.5rem, 4.5vw, 2.4rem);
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 2.5rem;
            color: #ffffff;
        }

        h1 span {
            color: var(--gold);
            display: block;
            margin-top: 0.5rem;
        }

        /* Responsive Choice Container: Stacks on phones, side-by-side on PCs */
        .choice-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        @media (min-width: 700px) {
            .choice-row {
                flex-direction: row;
                gap: 2rem;
            }
        }

        .choice-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 300px;
            text-decoration: none;
            background-color: #ffffff;
            color: #0f172a;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 1.75rem 1.5rem;
            border: 5px solid #000000;
            border-radius: 22px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .choice-btn small {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: none;
            margin-top: 0.4rem;
            color: #334155;
        }

        /* Emergency Button: High-alert red/gold styling */
        .choice-btn.emergency {
            background-color: #fee2e2;
            border-color: var(--emergency-red);
            box-shadow: 10px 10px 0px var(--emergency-red);
        }

        .choice-btn.emergency:hover {
            transform: translate(-3px, -4px);
            box-shadow: 14px 14px 0px var(--emergency-red);
        }

        /* Non-Emergency Button: Calm teal/green styling */
        .choice-btn.non-emergency {
            background-color: #ccfbf1;
            border-color: var(--teal-glow);
            box-shadow: 10px 10px 0px var(--teal-glow);
        }

        .choice-btn.non-emergency:hover {
            transform: translate(-3px, -4px);
            box-shadow: 14px 14px 0px var(--teal-glow);
        }

        .or-divider {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--gold);
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <nav class="top-nav" aria-label="Navigation">
            <a href="index.html" class="nav-btn home-btn">← Home</a>
            <a href="Sityss.html" class="nav-btn">Our Service</a>
            <a href="post.html" class="nav-btn">Post</a>
            <a href="training.html" class="nav-btn">Training</a>
        </nav>

        <main class="decision-card">
            <h1>
                TO BETTER UNDERSTAND YOUR NEEDS:
                <span>IS IT AN...</span>
            </h1>

            <div class="choice-row">
                <a href="EMERGENCE.HTML" class="choice-btn emergency">
                    EMERGENCY?
                    <small>Burst pipes, heavy leaks & urgent repairs</small>
                </a>

                <span class="or-divider">OR</span>

                <a href="Sityss.html" class="choice-btn non-emergency">
                    NON-EMERGENCY?
                    <small>Installations, maintenance & booking</small>
                </a>
            </div>
        </main>
    </div>

</body>

</html>
