<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts | Plumber Hertier</title>
     <link rel="icon" type="image/jpeg" href="MINE.JPG">
    <style>
        :root {
            --bg-top: #0f2922;
            --bg-blue: #1c6683;
            --teal-glow: #2ead8f;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-top), var(--bg-blue));
            color: var(--text-light);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
        }

        /* Clean button bar replacing the empty <table> and <s> tags */
        .nav-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .nav-btn {
            display: inline-block;
            text-decoration: none;
            background-color: #000000;
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 1.1rem 2rem;
            border: 4px solid #1e293b;
            border-radius: 18px;
            box-shadow: 8px 8px 0px var(--teal-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .nav-btn:hover,
        .nav-btn:focus {
            border-color: var(--teal-glow);
            transform: translate(-2px, -3px);
            box-shadow: 11px 11px 0px var(--teal-glow);
        }

        .nav-btn.home-btn {
            background-color: var(--teal-glow);
            color: #0f172a;
            box-shadow: 8px 8px 0px #000000;
        }

        header {
            background: linear-gradient(to bottom, #ffffff, #e2e8f0);
            color: #0f172a;
            border: 6px solid #000000;
            border-radius: 26px;
            box-shadow: 12px 12px 0px var(--teal-glow);
            padding: 2rem 1.5rem;
        }

        h1 {
            font-size: clamp(1.6rem, 4.5vw, 2.75rem);
            font-weight: 900;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <nav class="nav-bar" aria-label="Main Links">
            <a href="index.html" class="nav-btn home-btn">← Home</a>
            <a href="https://www.callpreferredplumbing.com/gallery/" target="_blank" rel="noopener" class="nav-btn">Photos</a>
            <a href="https://www.stesso.com/videos/2317-1" target="_blank" rel="noopener" class="nav-btn">Videos</a>
            <a href="about us.html" class="nav-btn">About Us</a>
        </nav>

        <header>
            <h1>TO SERVE YOU IS OUR PRIORITY</h1>
        </header>
    </div>

</body>

</html>
