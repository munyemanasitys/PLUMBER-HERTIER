<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EMERGENCY</title>
    <style>
        body {
            background-color: chocolate;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 16px;
        }

        .box {
            max-width: 560px;
            margin: 0 auto;
            background: #fff8e1;
            border: 12px solid goldenrod;
            border-radius: 20px;
            box-shadow: 10px 10px 0 black;
            padding: 16px;
        }

        h3 {
            font-size: x-large;
        }

        a {
            font-size: x-large;
            color: inherit;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            font-size: x-large;
            padding: 12px;
            margin: 6px 0 14px;
            border: 4px solid goldenrod;
            border-radius: 30px;
            text-align: center;
        }

        button {
            width: 100%;
            font-size: x-large;
            font-weight: bold;
            padding: 14px;
            border: 0;
            border-radius: 30px;
            background: #25a244;
            color: white;
            cursor: pointer;
        }
        

        #thanks {
            display: none;
        }
    </style>
</head>

<body>
    <div class="box">
        <h3>Call WhatsApp: <a href="https://wa.me/250782680579">+250 782680579</a></h3>
        <h3>Call: <a href="tel:0782680579">0782680579</a></h3>

        <form id="emForm">
            <p>If the line is busy, please put in your number and we will call you back in a few minutes.</p>
            <input type="tel" id="phone" placeholder="Enter your pnone number" required>
            <label for="need">Specify your needs please</label>
            <input type="text" id="need" placeholder="You want me to:" required>
            <button type="submit">SUBMIT</button>
        </form>

        <div id="thanks">
            <h3>Thank you! Please press Send in WhatsApp. We will call you back soon.</h3>
        </div>
    </div>

    <script>
        const myNumber = "250782680579";

        document.getElementById("emForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const phone = document.getElementById("phone").value.trim();
            const need = document.getElementById("need").value.trim();

            const text = "*EMERGENCY request*\nPhone: " + phone + "\nNeed: " + need;

            window.open("https://wa.me/" + myNumber + "?text=" + encodeURIComponent(text), "_blank");

            document.getElementById("emForm").style.display = "none";
            document.getElementById("thanks").style.display = "block";
        });
    </script>
</body>

</html>
